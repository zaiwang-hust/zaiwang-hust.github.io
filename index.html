  <style>
    :root { color-scheme: light; --ink:#192f35; --muted:#52666b; --accent:#246e68; --line:#d8e3df; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f7f9f6; color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; line-height:1.7; }
    .page { max-width:900px; margin:auto; padding:40px 28px 28px; }
    header { display:flex; justify-content:space-between; gap:20px; align-items:center; padding-bottom:22px; border-bottom:1px solid var(--line); font-size:14px; }
    .brand { font-weight:650; letter-spacing:.04em; }
    a { color:var(--accent); text-underline-offset:5px; }
    a:hover { color:var(--ink); }
    a:focus-visible { outline:3px solid var(--accent); outline-offset:6px; border-radius:2px; }
    main { padding:80px 0 68px; }
    .eyebrow { color:var(--accent); font-size:12px; font-weight:700; letter-spacing:.16em; margin:0 0 20px; }
    h1 { font-size:clamp(48px,9vw,72px); font-weight:650; letter-spacing:.07em; line-height:1.2; margin:0 0 24px; }
    .affiliation { font-size:22px; margin:0; }
    .english { color:var(--muted); font-size:16px; margin:6px 0 0; }
    .details { display:grid; grid-template-columns:1fr 1fr; gap:36px; margin-top:64px; border-top:1px solid var(--line); padding-top:32px; }
    h2 { font-size:15px; font-weight:650; margin:0 0 16px; }
    h2 span { color:var(--muted); font-size:12px; font-weight:400; padding-left:10px; }
    .details p { margin:0 0 8px; }
    .mail { font-size:19px; overflow-wrap:anywhere; }
    footer { border-top:1px solid var(--line); padding-top:20px; font-size:12px; color:var(--muted); }
    @media(max-width:560px) { .page { padding:24px; } header { font-size:12px; } main { padding:56px 0 48px; } .details { grid-template-columns:1fr; gap:32px; margin-top:44px; } .affiliation { font-size:19px; } }
  </style>
</head>
<body>
